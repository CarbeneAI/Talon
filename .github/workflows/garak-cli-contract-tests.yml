name: Garak CLI contract tests

on:
  push:
  pull_request:
    paths:
      - references/ai-red-team/runner/README.md
      - references/ai-red-team/runner/requirements.txt
      - references/ai-red-team/runner/redteam.py
      - references/ai-red-team/runner/test_garak_cli.py
      - .github/workflows/garak-cli-contract-tests.yml

permissions:
  contents: read

jobs:
  garak-cli-contract-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Run offline CLI contract tests
        working-directory: references/ai-red-team/runner
        run: python -B -m unittest test_garak_cli -v

name: Runner tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  report-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Test reports, command status, and ignore rules offline
        working-directory: references/ai-red-team/runner
        run: python -B -m unittest discover -v

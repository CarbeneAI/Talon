name: Runner tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Test report generation offline
        working-directory: references/ai-red-team/runner
        run: python -B -m unittest discover -v
